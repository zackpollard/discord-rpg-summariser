# POSTGRES_PASSWORD must be set or every compose subcommand fails rather than
# defaulting to a known password. Copy .env.example to .env next to this file
# so `down`, `logs` and `ps` keep working too. Use an alphanumeric
# value: it is interpolated into a URL, so @ : / ? # % would have to be
# percent-encoded. On an existing deployment the password baked into the pgdata
# volume does not change with this variable — run
# `ALTER USER rpg WITH PASSWORD '<new>'` once against the running database
# (or recreate the volume) when adopting it.
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: rpg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: rpg_summariser
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-prod-db.sql:/docker-entrypoint-initdb.d/init-prod-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpg -d rpg_summariser"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    image: ghcr.io/zackpollard/discord-rpg-summariser:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Loopback only: the panel serves session audio and transcripts, so put a
      # TLS-terminating reverse proxy in front of it rather than publishing it
      # on every host interface (Docker's published ports bypass ufw/firewalld).
      - "127.0.0.1:8080:8080"
    volumes:
      - botdata:/data
    environment:
      DATABASE_URL: postgres://rpg:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/rpg_summariser?sslmode=disable
      # Discord OAuth2 for the web panel. Without these the panel is
      # unauthenticated and the bot logs a startup warning; the published port
      # is loopback-only above, so put an authenticating proxy in front of it.
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      WEB_ALLOW_UNAUTHENTICATED: ${WEB_ALLOW_UNAUTHENTICATED:-}

volumes:
  pgdata:
  botdata:
